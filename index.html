<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Structure and Properties</title>
  <link rel="stylesheet" href="style.css">
  <style>
    p > span { color: red; }
    #header span { color: pink; }
    span { color: green; }
    #header *:last-child { color: orange; }
    #header span:first-child:hover { color: blue; }
  </style>
</head>
<body>
  <main>
    <div class="image-preview">
      <img src="https://cpit405.gitlab.io/images/KAU_logo.png" alt="King Abdulaziz University logo">
    </div>


    <div class="selector-demo">
      <div id="header">
        <span class="myclass1">Every</span>
        <span class="myclass2">one can</span>
        <span class="myclass3">success.</span>
      </div>
      <p>One machine can do the work of fifty ordinary men. <span class="myclass4">No machine can do the work of one extraordinary man.</span></p>
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>color</th>
          <th>color when mouse over</th>
        </tr>
      </thead>
      <tbody>
        <tr><th>span.myclass1</th><td>pink</td><td>blue</td></tr>
        <tr><th>span.myclass2</th><td>pink</td><td>pink</td></tr>
        <tr><th>span.myclass3</th><td>orange</td><td>orange</td></tr>
        <tr><th>span.myclass4</th><td>red</td><td>red</td></tr>
      </tbody>
    </table>

  </main>
</body>
</html>
